

services:
  db:
    image: postgres:17.6
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=henry
      - POSTGRES_PASSWORD=james4321
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: redis_queue
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  prisma-studio:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://${DB_USERNAME:-henry}:${DB_PASSWORD:-james4321}@db:5432/${DB_NAME:-mydb}?schema=public
    command: >
      sh -c "npm install prisma && npx prisma studio --browser none"
    depends_on:
      - db



volumes:
  postgres_data:
  redis_data: